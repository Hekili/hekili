name: apl-syncer

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hekili (thewarwithin)
        uses: actions/checkout@v4
        with:
          ref: thewarwithin

      - name: Run sync check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            // 'core', 'github', and 'context' are already provided by github-script

            const dir = 'TheWarWithin/Priorities';
            const files = fs.existsSync(dir)
              ? fs.readdirSync(dir).filter(f => f.endsWith('.lua')).map(f => path.join(dir, f))
              : [];

            core.info(`Found ${files.length} Lua priority files under ${dir}`);

            const upstream = { owner: 'simulationcraft', repo: 'simc', branch: 'thewarwithin' };

            function head(filepath, n = 6) {
              return fs.readFileSync(filepath, 'utf8').split(/\r?\n/).slice(0, n);
            }

            const results = [];
            for (const f of files) {
              const top = head(f, 6);

              const upstreamLine = top.find(l => l.startsWith('## Upstream:'));
              const shaLine      = top.find(l => l.toLowerCase().includes('simulationcraft commit sync'));

              if (!upstreamLine || !shaLine) {
                results.push({ file: f, status: 'missing_header' });
                continue;
              }

              const matchPath = upstreamLine.match(/ActionPriorityLists\/default\/[A-Za-z0-9._-]+\.simc/);
              const matchSha  = shaLine.match(/[0-9a-f]{7,40}/i);

              if (!matchPath || !matchSha) {
                results.push({ file: f, status: 'unparseable_header' });
                continue;
              }

              const upstreamPath = matchPath[0];
              const recordedSha  = matchSha[0];

              const { data: commits } = await github.rest.repos.listCommits({
                owner: upstream.owner,
                repo: upstream.repo,
                sha: upstream.branch,
                path: upstreamPath,
                per_page: 1
              });

              if (!commits.length) {
                results.push({ file: f, status: 'upstream_not_found', upstreamPath });
                continue;
              }

              const latestShaFull = commits[0].sha;
              const latestSha7    = latestShaFull.slice(0,7);
              const recordedSha7  = recordedSha.slice(0,7);
              const upToDate      = latestSha7 === recordedSha7;

              results.push({
                file: f,
                upstreamPath,
                recordedSha,
                latestSha: latestShaFull,
                status: upToDate
                  ? '✅ Up to date'
                  : `❌ Out of date [compare](https://github.com/${upstream.owner}/${upstream.repo}/compare/${recordedSha}...${latestShaFull})`
              });
            }

            const rows = [
              '| File | Upstream `.simc` | Recorded SHA | Latest Upstream SHA | Status |',
              '|------|-------------------|--------------|---------------------|--------|',
              ...results.map(r =>
                `| ${r.file} | ${r.upstreamPath ?? '—'} | \`${r.recordedSha ?? '—'}\` | \`${r.latestSha ? r.latestSha.slice(0,7) : '—'}\` | ${r.status ?? 'missing'} |`
              )
            ];

            const body = [
              `This issue updates automatically. It compares the recorded **SimulationCraft Commit Sync** in each Lua priority file with the latest commit that touched the corresponding upstream **.simc** on \`${upstream.branch}\`.`,
              '',
              rows.join('\n'),
              '',
              '_Last run: ' + new Date().toISOString() + '_'
            ].join('\n');

            const issueTitle = 'APL sync status (auto)';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation,apl-sync',
              per_page: 100
            });

            let issue = existing.find(i => i.title === issueTitle);

            const wantedLabels = ['automation','apl-sync'];
            for (const l of wantedLabels) {
              try { await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l }); }
              catch { try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l }); } catch {} }
            }

            if (issue) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: issueTitle, body, labels: wantedLabels });
            }
